name: mag-by

# mag-by's default build is what a small processor links: no_std, depending on nothing. Cargo
# turns a feature on for every user of a crate in one build, so the agent's files (the `graph`
# feature) must never reach it; this checks that the default build still builds without std and
# still has no dependencies, and runs the crate's tests, which hold the kept schemas and DOT to
# what the code generates; that mag-mortar, without its files, depends on mag-by alone; and
# mag-mar's link between two members over loopback.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mag-by:
    runs-on: linux-docker
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add thumbv7em-none-eabihf
          rustc --version

      - name: The default build is no_std
        run: cargo build --locked -p mag-by --target thumbv7em-none-eabihf

      - name: The default build depends on nothing
        run: |
          deps=$(cargo tree --locked -p mag-by -e normal --prefix none | tail -n +2)
          if [ -n "$deps" ]; then
            echo "mag-by's default build depends on:"
            echo "$deps"
            exit 1
          fi

      - name: mag-mortar without its files depends on mag-by alone
        run: |
          deps=$(cargo tree --locked -p mag-mortar -e normal --prefix none | tail -n +2)
          if [ "$deps" != "$(cargo tree --locked -p mag-by -e normal --prefix none)" ]; then
            echo "mag-mortar's default build depends on:"
            echo "$deps"
            exit 1
          fi

      - name: Tests, with the kept schemas' and DOT's checks
        run: cargo test --locked -p mag-by

      # Alone, so that no other crate's features reach serde_json: the ledger's floats must
      # read back exactly through mag-by's own.
      - name: The placement loop's tests, the guard's and the ledger's among them
        run: cargo test --locked -p mag-mortar

      # Alone too: two members over loopback with TLS 1.3, each refusal, one channel per job,
      # and a tensor of 64 MiB byte for byte.
      - name: The link between members
        run: cargo test --locked -p mag-mar

      - name: The plan command, as the README gives it, prints the kept plan
        run: |
          cargo run --locked -q -p mag-mortar --features files --example mag -- plan \
            crates/mag-by/pools/example.json crates/mag-by/graphs/example.json > plan.txt
          diff crates/mag-mortar/plans/example.txt plan.txt

      - name: The list-of-machines recipe's command prints its kept plan
        run: |
          cargo run --locked -q -p mag-mortar --features files --example mag -- plan \
            examples/machine-list/pool.json crates/mag-by/graphs/example.json > recipe-plan.txt
          diff examples/machine-list/plan.txt recipe-plan.txt
