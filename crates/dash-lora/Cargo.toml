[package]
name = "dash-lora"
description = "LoRA for Burn: frozen low-precision base weights, full-precision adapters that alone receive gradients, never merged, read and written in PEFT's format."
readme = "README.md"
keywords = ["burn", "lora", "fine-tuning", "machine-learning"]
categories = ["science"]
# The recorded references the tests read stay in the repository, out of the published crate.
exclude = ["tests/fixtures"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["flex"]
# Flex and the CubeCL runtimes, as in dash-ops, each turning on dash-ops' feature of the same name.
# LoRA is built from Burn's own operations and dash-ops' activation checkpointing, so each only
# makes its devices available.
flex = ["burn/flex", "burn/simd", "burn/rayon", "dash-ops/flex"]
cuda = ["burn/cuda", "cubecl", "dash-ops/cuda"]
rocm = ["burn/rocm", "cubecl", "dash-ops/rocm"]
wgpu = ["burn/wgpu", "cubecl", "dash-ops/wgpu"]
vulkan = ["burn/vulkan", "wgpu", "dash-ops/vulkan"]
metal = ["burn/metal", "wgpu", "dash-ops/metal"]
webgpu = ["burn/webgpu", "wgpu", "dash-ops/webgpu"]
cpu = ["burn/cpu", "cubecl", "dash-ops/cpu"]
# What every runtime above turns on, for tests and examples to ask whether a CubeCL device is
# there. Not a runtime itself.
cubecl = []
# Burn's autotune: each kernel chosen by timing the candidates on the device the first time a
# shape runs, again in every new process (the tuning cache does not persist). Off by default for
# the reason fusion is: it changes which kernels, and so which low bits, every Burn crate in the
# same build runs. Matmul-heavy work wants it: on an RTX 5070 Ti, Burn's bf16
# [6144x3584]x[3584x1024] runs at 6 TFLOPS without it and 75 with it.
autotune = ["burn/autotune"]

[dependencies]
burn = { workspace = true, features = ["autodiff", "optim"] }
dash-contract = { workspace = true }
dash-ops = { workspace = true }
dash-peft = { workspace = true }

[dev-dependencies]
safetensors = "0.8"
serde_json = "1"
