[package]
name = "mag-mortar"
description = "The placement library of a mag pool: the loop that decides where each part of each job runs, from what the pool's devices offer, with the record of every decision and the pool's state as a ledger to replay. It does no I/O: a home system's control plane, or the program that submits a job, runs it."
readme = "README.md"
keywords = ["scheduling", "distributed", "machine-learning"]
categories = ["science"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mag-by = { workspace = true }

[features]
# The files: the ledger as lines and the graph file, through mag-by's `graph` feature. Off, this
# crate depends on mag-by alone.
files = ["mag-by/graph"]

[dev-dependencies]
# The tests write and read the ledger's lines whatever features the command line names.
mag-by = { workspace = true, features = ["graph"] }
# The `mag` example prints a record as JSON.
serde_json = "1"

[[example]]
name = "mag"
required-features = ["files"]
