[package]
name = "mag-mar"
description = "The program every member of a mag pool runs. So far its link, one channel per job to another member over TCP with TLS 1.3, both ends holding certificates from the pool's own authority, carrying mag-by's words and tensors of any size; and the program's skeleton, which joins the pool and gives its devices back on SIGTERM within its time, and as coordinator records the members' joins and leaves in the pool's ledger and serves the door, where a command submits a job, ends one, asks the pool's status or takes a device back by need, which the member holding it is told to give back."
readme = "README.md"
keywords = ["scheduling", "distributed", "machine-learning", "tls"]
categories = ["network-programming"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The words on a link, and serde on them.
mag-by = { workspace = true, features = ["graph"] }
# The pool the coordinator keeps, and its ledger. Without `files`, it adds no crate beyond mag-by.
mag-mortar = { workspace = true }
# TLS 1.3 only, with ring as the provider: no C toolchain beyond ring's own, and no cmake.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# The certificate checks rustls makes, called directly to read who a certificate names.
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["ring", "std"] }
serde = "1"
serde_json = "1"
# TCP keepalive's timings, which std does not set. `all` holds the interval and the count of
# probes; without it only the tests, through the dev-dependency, would build.
socket2 = { version = "0.6.5", features = ["all"] }
# Making a pool's authority and its members' certificates: the host's, not every member's.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto", "x509-parser"], optional = true }
ring = { version = "0.17.14", optional = true }
time = { version = "0.3.47", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
# SIGTERM, the host's notice that a member's lease ends: a handler that writes a byte to a pipe.
# Already in the tree through socket2, so it adds no crate; signal-hook would add two.
libc = "0.2.189"

[features]
# Issuing certificates: what the host runs, for the `certs` command. Off, a member links no
# certificate generator.
issue = ["dep:rcgen", "dep:ring", "dep:time"]

[dev-dependencies]
mag-mar = { path = ".", features = ["issue"] }
# A client that offers TLS 1.2 only, to see it refused.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# A certificate the authority signs naming two members, which `Authority::issue` cannot make.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto", "x509-parser"] }
# Reading keepalive's timings back from a socket.
socket2 = { version = "0.6.5", features = ["all"] }
# The end of a certificate the tests make short-lived.
time = { version = "0.3.47", default-features = false }

[[example]]
name = "certs"
required-features = ["issue"]

[[example]]
name = "loopback"
required-features = ["issue"]
