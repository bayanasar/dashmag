[package]
name = "dash-cli"
description = "Backend-agnostic command-line runner for Dashmag inference."
readme = "README.md"
keywords = ["inference", "edge", "machine-learning", "cli"]
categories = ["command-line-utilities", "science"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "dash"
path = "src/main.rs"

[[bin]]
name = "dash-import"
path = "src/bin/dash-import.rs"
required-features = ["import"]

[features]
default = ["tract", "image"]
tract = ["dep:dash-tract"]
iree = ["dep:dash-iree"]
tensorrt = ["dep:dash-tensorrt"]
edgetpu = ["dep:dash-edgetpu"]
# convenience: every board accelerator behind one flag (the facade, not a merged crate)
accelerators = ["tensorrt", "edgetpu"]
# `--image`: decode and preprocess a JPEG in Rust instead of taking a prepared tensor
image = ["dep:dash-image"]
# Burn: models built from code, weights loaded. `burn` is Flex, the pure-Rust CPU device;
# each GPU device is its own feature and needs a dynamically linked build.
burn = ["dep:dash-burn"]
burn-cuda = ["burn", "dash-burn/cuda"]
burn-rocm = ["burn", "dash-burn/rocm"]
burn-metal = ["burn", "dash-burn/metal"]
# `dash-import`: a PyTorch checkpoint to model.safetensors, for a model dash-models builds.
import = ["dep:dash-models", "dash-models/pytorch", "dep:burn", "burn/flex"]

[dependencies]
dash-core = { workspace = true }
dash-tract = { workspace = true, optional = true }
dash-iree = { workspace = true, optional = true }
dash-tensorrt = { workspace = true, optional = true }
dash-edgetpu = { workspace = true, optional = true }
dash-image = { workspace = true, optional = true }
dash-burn = { workspace = true, optional = true }
dash-models = { workspace = true, optional = true }
burn = { workspace = true, optional = true }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
burn = { workspace = true, features = ["flex"] }
dash-models = { workspace = true }

[[test]]
name = "burn"
required-features = ["burn"]

[[test]]
name = "recorded"
required-features = ["burn", "image"]
