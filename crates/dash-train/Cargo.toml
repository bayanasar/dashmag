[package]
name = "dash-train"
description = "A training loop for multi-head classifiers on Burn modules, reproducing a PyTorch recipe with dash-mag's training modules and the Burn-tensor loss and AdamW it still needs. The loop and command line are moving to the application that uses them."
readme = "README.md"
keywords = ["burn", "training", "classification", "machine-learning"]
categories = ["science"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "dash-train"
path = "src/main.rs"

[features]
default = ["flex"]
# Flex trains on every core with SIMD; without `simd` and `rayon` it runs scalar on one core.
flex = ["burn/flex", "burn/simd", "burn/rayon"]
cuda = ["burn/cuda"]
rocm = ["burn/rocm"]
metal = ["burn/metal"]
# Burn's lazy fusion and its autotune, as in dash-ops: off by default, for they change which
# kernels, and so which low bits, every Burn crate in the same build runs.
fusion = ["burn/fusion"]
autotune = ["burn/autotune"]

[dependencies]
burn = { workspace = true, features = ["autodiff", "optim"] }
dash-core = { workspace = true }
# The training modules written once: the schedule, the class weights and the targets' mask, the
# metrics and the choice of a calibration shift.
dash-mag = { workspace = true }
dash-image = { workspace = true }
# The published PyTorch checkpoint a run starts from is read directly.
dash-models = { workspace = true, features = ["pytorch"] }
# Only the library: the model description, read and written in one format.
dash-cli = { path = "../dash-cli", version = "0.0.1", default-features = false }
serde_json = "1"

[dev-dependencies]
# A run trained in a pool of a chosen size, and its weights read as Burn writes them.
rayon = "1"
safetensors = "0.8"
