[package]
name = "dash-image"
description = "Image preprocessing for Dashmag models: JPEG decode, Pillow-exact bilinear resize, normalisation."
readme = "README.md"
keywords = ["image", "preprocessing", "jpeg", "resize", "machine-learning"]
categories = ["multimedia::images", "science"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# No SIMD: the host and every board decode through the same scalar code.
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = "0.5"

[dev-dependencies]
serde_json = "1"
