[package]
name = "dash-ops"
description = "Operations Burn does not have built in, for training and decoding sequence models, each a backend extension with a reference built from Burn's tensor operations, CubeCL kernels and its own backward pass; and activation checkpointing."
readme = "README.md"
keywords = ["burn", "cuda", "kernels", "machine-learning"]
categories = ["science"]
# The recorded references the tests read stay in the repository, out of the published crate.
exclude = ["tests/fixtures"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["flex"]
# Flex runs every operation through its reference, built from Burn's own tensor operations.
flex = ["burn/flex", "burn/simd", "burn/rayon"]
# The CubeCL runtimes Burn 0.22 has: each makes its devices available and compiles the CubeCL
# kernels, which are written once for Burn's one CubeCL backend type and run on whichever runtime
# a tensor's device names. A device that lacks what a kernel asks for (shared memory, units per
# cube, a plane width, a dtype) runs the operation's reference instead.
cuda = ["burn/cuda", "cubecl"]
# ROCm, through HIP.
rocm = ["burn/rocm", "cubecl"]
# wgpu on whichever graphics API the machine offers, kernels compiled to WGSL. `vulkan` and
# `metal` pin the API and compile to SPIR-V and MSL; `webgpu` pins the browser's WebGPU.
wgpu = ["burn/wgpu", "cubecl"]
vulkan = ["burn/vulkan", "wgpu"]
metal = ["burn/metal", "wgpu"]
webgpu = ["burn/webgpu", "wgpu"]
# CubeCL's CPU runtime, kernels compiled through LLVM.
cpu = ["burn/cpu", "cubecl"]
# What every runtime above turns on: the CubeCL implementations. Not a runtime itself, and it does
# not build without one.
cubecl = ["dep:burn-cubecl", "dep:cubecl"]
# Burn's lazy fusion. Off by default: it changes which kernels every Burn crate in the same build
# runs, and the comparisons elsewhere in this workspace are made without it.
fusion = ["burn/fusion"]
# Burn's autotune: each kernel chosen by timing the candidates on the device the first time a
# shape runs, again in every new process (the tuning cache does not persist). Off by default for
# the reason fusion is: it changes which kernels, and so which low bits, every Burn crate in the
# same build runs. Matmul-heavy work wants it: on an RTX 5070 Ti, Burn's bf16
# [6144x3584]x[3584x1024] runs at 6 TFLOPS without it and 75 with it.
autotune = ["burn/autotune"]

[dependencies]
burn = { workspace = true, features = ["autodiff", "extension"] }
dash-contract = { workspace = true }
burn-cubecl = { workspace = true, optional = true }
cubecl = { workspace = true, optional = true }

[dev-dependencies]
safetensors = "0.8"
serde_json = "1"
