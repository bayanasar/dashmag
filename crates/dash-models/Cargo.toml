[package]
name = "dash-models"
description = "Model architectures for Dashmag as Burn modules, named so that published PyTorch weights load unchanged."
readme = "README.md"
keywords = ["burn", "mobilenet", "edge", "machine-learning", "inference"]
categories = ["science", "computer-vision"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Read published PyTorch checkpoints (`.pth`) directly, in Rust.
pytorch = ["burn/pytorch"]

[dependencies]
burn = { workspace = true, features = ["safetensors"] }
dash-core = { workspace = true }

[dev-dependencies]
burn = { workspace = true, features = ["flex", "pytorch"] }
dash-image = { workspace = true }
dash-tract = { workspace = true }

[[test]]
name = "torchvision"
required-features = ["pytorch"]
