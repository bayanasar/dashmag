[package]
name = "dash-mlx"
description = "dash-ops' and dash-lora's operations on MLX, for Apple silicon: the same contracts, with MLX's arrays in place of Burn's tensors."
readme = "README.md"
keywords = ["mlx", "metal", "apple-silicon", "machine-learning"]
categories = ["science"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
# Exposes the directory of a prebuilt MLX to dependents, as DEP_MLX_LIB_DIR (README).
links = "mlx"

# MLX runs on Apple silicon only. Elsewhere the crate is empty, so the workspace builds on every
# target without it.
[target.'cfg(target_os = "macos")'.dependencies]
dash-contract = { workspace = true }
dash-peft = { workspace = true }
half = "2"

# The bindings to mlx-c (`mlx-c/`), and mlx-c itself (build.rs).
[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.73.2"
cmake = "0.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
dash-conformance = { workspace = true }
safetensors = "0.8"
serde_json = "1"
