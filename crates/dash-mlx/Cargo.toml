[package]
name = "dash-mlx"
description = "dash-ops' and dash-lora's operations on MLX, for Apple silicon: the same contracts, with MLX's arrays in place of Burn's tensors."
readme = "README.md"
keywords = ["mlx", "metal", "apple-silicon", "machine-learning"]
categories = ["science"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published until an mlx-rs release carries the wrappers it calls: until then mlx-rs and
# mlx-sys are git dependencies, which crates.io does not take (README).
publish = false

# MLX runs on Apple silicon only. Elsewhere the crate is empty, so the workspace builds on every
# target without it. mlx-sys is named directly for its `DEP_MLX_LIB_DIR` (build.rs).
[target.'cfg(target_os = "macos")'.dependencies]
mlx-rs = { workspace = true }
mlx-sys = { workspace = true }
