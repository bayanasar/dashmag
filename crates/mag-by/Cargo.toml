[package]
name = "mag-by"
description = "The words the mag- crates share to place an algorithm's work across a pool of machines: a job's graph, the checks it must pass, and the graph file. no_std, with no dependencies unless the agent's files are wanted."
readme = "README.md"
keywords = ["scheduling", "distributed", "machine-learning"]
categories = ["no-std"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
# float_roundtrip: every f64 a ledger writes must read back to the same bits, or a replayed
# record would differ from the one logged.
serde_json = { version = "1", optional = true, features = ["float_roundtrip"] }
schemars = { version = "1", optional = true }

[features]
# The files: the graph file in JSON, the ledger's lines, and serde on the shared types. Needs
# std. Without it the crate is no_std and depends on nothing; nothing a no_std member links may
# turn it on, since a feature one crate turns on is on for every user of this crate in that
# build.
graph = ["dep:serde", "dep:serde_json", "dep:schemars"]

[dev-dependencies]
# The tests read and write graph files whatever features the command line names.
mag-by = { path = ".", features = ["graph"] }
# Validates files against the schema in the tests: the schema is checked as a schema, not only
# compared as text.
jsonschema = { version = "0.63.0", default-features = false }

[[example]]
name = "dot"
required-features = ["graph"]
