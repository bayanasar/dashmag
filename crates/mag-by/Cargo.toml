[package]
name = "mag-by"
description = "The words the mag- crates share to place an algorithm's work across a pool of machines: a job's graph, the checks it must pass, and the graph file. no_std, with no dependencies unless the agent's files are wanted."
readme = "README.md"
keywords = ["scheduling", "distributed", "machine-learning"]
categories = ["no-std"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# The agent's files: the graph file in JSON, and serde on the shared types. Needs std. Without
# it the crate is no_std and depends on nothing; nothing a no_std member links may turn it on,
# since a feature one crate turns on is on for every user of this crate in that build.
graph = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
# The tests read and write graph files whatever features the command line names.
mag-by = { path = ".", features = ["graph"] }
