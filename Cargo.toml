[workspace]
resolver = "2"
members = ["crates/dash-core", "crates/dash-image", "crates/dash-models", "crates/dash-burn", "crates/dash-tract", "crates/dash-iree", "crates/dash-tensorrt", "crates/dash-edgetpu", "crates/dash-cli"]
exclude = ["patches"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/bayanasar/dashmag"
rust-version = "1.95"

[workspace.dependencies]
dash-core = { path = "crates/dash-core", version = "0.0.1" }
dash-image = { path = "crates/dash-image", version = "0.0.1" }
dash-models = { path = "crates/dash-models", version = "0.0.1" }
dash-burn = { path = "crates/dash-burn", version = "0.0.1" }
dash-tract = { path = "crates/dash-tract", version = "0.0.1" }
dash-iree = { path = "crates/dash-iree", version = "0.0.1" }
dash-tensorrt = { path = "crates/dash-tensorrt", version = "0.0.1" }
dash-edgetpu = { path = "crates/dash-edgetpu", version = "0.0.1" }
# Pinned exactly: Burn changes its API and its record format between minor releases, and an
# upgrade is its own change, checked against the same references.
burn = { version = "=0.22.1", default-features = false, features = ["std"] }

# cubecl-cuda 0.11.1 as published, but for one hunk: `CUBECL_CUDA_TF32=0` keeps f32 matmuls
# and convolutions in IEEE f32 on compute capability 8.0 and later. Burn has no setting for
# it yet; when it has, this and `patches/` go (patches/cubecl-cuda/PATCHED.md).
[patch.crates-io]
cubecl-cuda = { path = "patches/cubecl-cuda" }
